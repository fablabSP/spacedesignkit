<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Space Design Kit 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: drafting-table game. Catalog left, 1:20 model room centre, cards + checks right. Single committed dark look. */
:root{
  --bg:#0c1730; --panel:#13213f; --panel-2:#1a2b4f; --panel-3:#22365f; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --txt:#eef2fa; --mute:#9fb0cf; --dim:#6f82a6;
  --red:#e3262f; --red-s:rgba(227,38,47,.16); --blue:#3a6df0; --blue-s:rgba(58,109,240,.18); --green:#22a24a; --green-s:rgba(34,162,74,.18);
  --gold:#f5b700; --gold-s:rgba(245,183,0,.16); --ok:#3ccf74; --warn:#f5b700; --bad:#ff5a5f;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--txt);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:56px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:root{--z:1;--zs:1}
.app{display:grid;grid-template-rows:calc(56px*var(--z)) 1fr;height:100%}
.top{zoom:var(--z)}.side,.guide,.mission,.views,.penrail,.sheet,.lgnd{zoom:var(--z)}
.start{zoom:var(--zs)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mark{width:30px;height:30px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;background:var(--panel-3)}
.brand .mark i{border-radius:2px}
.beta{display:inline-block;vertical-align:middle;font-family:var(--f-body,inherit);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--gold);color:#1b1400;margin-left:4px;position:relative;top:-1px}
.eyebrow .beta{font-size:11px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.steps{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute);border:1px solid transparent}
.stp i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel-3);color:var(--mute)}
.stp.done i{background:var(--ok);color:#06210f}
.stp.cur{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
.stp.cur i{background:var(--gold);color:#1b1400}
.timer #tExt{display:inline-flex;align-items:center;padding:4px 8px;border-radius:7px;background:var(--gold);color:#1b1400;font-weight:800;font-size:12px}
.timer #tExt[hidden]{display:none}
.timer.paused .t{opacity:.6}
.timer.held:after{content:'Scoring';font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
#steps.locked .stp:not(.cur){opacity:.4;cursor:not-allowed}
.timer{flex:none;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:18px;min-width:62px;text-align:right}
.timer.over .t{color:var(--bad)}
.timer button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.timer button:hover{background:var(--panel-3);color:var(--txt)}
.budget{flex:none;min-width:170px}
.budget .row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute);font-weight:600}
.budget .row b{color:var(--txt);font-family:var(--f-mono)}
.budget .bar{height:6px;border-radius:4px;background:var(--panel-3);margin-top:4px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.budget.over .bar i{background:var(--bad)} .budget.over .row b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--panel-3);border:1px solid var(--line-2);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--gold);color:#1b1400;border-color:transparent}
.btn.red{background:var(--red);border-color:transparent}.btn.blue{background:var(--blue);border-color:transparent}.btn.green{background:var(--green);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.iconbtn:hover{background:var(--panel-3)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* main */
.main{display:grid;grid-template-columns:calc(260px*var(--z)) 1fr calc(330px*var(--z));min-height:0}
.side{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.side.left{border-right:1px solid var(--line)} .side.right{border-left:1px solid var(--line)}
.sec{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.sec.chksec{background:linear-gradient(180deg,rgba(60,207,116,.09),rgba(60,207,116,.03));border-left:3px solid #3ccf74;border-top:1px solid rgba(60,207,116,.35)}
.sec.chksec h3{color:#7fe0a5}
.sec h3{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.scroll{overflow-y:auto;min-height:0;flex:1}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.lhead h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--txt)}
.lhead .cnt{font-size:11.5px;color:var(--mute);background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.lsearch{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:0 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2)}
.lsearch:focus-within{border-color:var(--gold)}
.lsearch .ic{width:16px;height:16px;flex:none;color:var(--mute)}
.lsearch input{border:0;background:transparent;padding:9px 0;outline:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px 12px;border-bottom:1px solid var(--line)}
.lfoot{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.lfoot b{color:var(--txt);font-weight:700}
.lbl.sub{margin:10px 4px 6px;font-size:10.5px}
.it .tx{min-width:0}
.it .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.it .chips em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.02em;color:#c7d2e6;background:var(--panel-3);padding:1px 6px;border-radius:4px}
.cat{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;font-size:11px;font-weight:700;color:var(--mute);background:var(--panel-2);border:1px solid transparent}
.cat .ic{width:18px;height:18px}
.cat:disabled{opacity:.3;cursor:not-allowed}
.fseq{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0 2px}
.fseq .btn.sm{padding:6px 8px;font-size:12px}
.fseq{flex-wrap:nowrap}.fseq .arr{font-size:12px}
.fseq .btn:disabled{opacity:.35;cursor:not-allowed}
.fseq .btn.done{opacity:.75}
.fseq .arr{color:var(--mute);font-weight:800}
.fseq .arr.on{color:var(--gold)}
.cats{display:grid;grid-template-columns:2fr 6fr}
.cgrp{display:grid;gap:4px;align-content:start}.cgrp>div{display:grid;gap:4px}
.cgrp small{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding-left:2px}
.cgrp.sp small{color:#5fd0c4}
.cgrp>.cghd{display:flex;align-items:center;justify-content:space-between;gap:2px;padding-right:8px;border-right:0;margin-right:0;height:18px}
.cgrp>small{height:18px;display:flex;align-items:center}
.timer.off #tval{font-size:13px;cursor:pointer;color:var(--mute)}
.wchud{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(19,33,63,.96);border:1px solid #5fd0c4;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:8;max-width:calc(100% - 24px);flex-wrap:nowrap;white-space:nowrap}
@media (max-width:760px){.wchud{flex-wrap:wrap;white-space:normal}}
.wchud .ck{white-space:nowrap}
.wchud .wt{display:grid;gap:2px;min-width:180px;max-width:300px;font-size:12.5px}.wchud .wt b{color:#5fd0c4;font-size:13px}
.wchud .wpad{display:flex;align-items:center;gap:4px}.wchud .wpad>div{display:grid;gap:4px}
.wchud .wpad button{width:40px;height:34px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-2);font-size:14px;touch-action:none;user-select:none}
.wchud .wpad button:active{background:#5fd0c4;color:#062a26}
.ilock{position:absolute;transform:translateX(-50%) scale(var(--z));transform-origin:50% 0;display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--panel);border:1px solid #5fd0c4;color:#5fd0c4;font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:6;cursor:pointer;white-space:nowrap}
.ilock svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ilock.on{background:#5fd0c4;color:#062a26}
.slock{width:20px;height:18px;display:grid;place-items:center;border-radius:6px;border:1px solid #5fd0c4;color:#5fd0c4;background:transparent;padding:0;cursor:pointer}
.slock .ic{width:12px;height:12px}.slock:hover{background:rgba(95,208,196,.15)}
.slock.on{background:#5fd0c4;color:#062a26}
.cat{position:relative}.cat .lkb{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:4px;background:#5fd0c4;display:grid;place-items:center}
.cat .lkb svg{width:9px;height:9px;fill:none;stroke:#062a26;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cat.sp.on .lkb{background:#062a26}.cat.sp.on .lkb svg{stroke:#5fd0c4}.cgrp.fu small{color:var(--gold)}
.cgrp.sp>div{grid-template-columns:1fr;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.cgrp.fu>div{grid-template-columns:repeat(3,1fr)}
.cat.sp .ic{color:#5fd0c4}.cat.fu .ic{color:var(--gold)}
.cat.sp.on{background:#5fd0c4;color:#062a26}.cat.sp.on .ic{color:#062a26}
.cat.fu.on .ic{color:var(--bg)}
.roomp{padding:8px 4px 12px;gap:14px}
.roomp section{display:grid;gap:6px}
.racc{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
.racc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;transition:background .2s,box-shadow .3s}
.racc>summary::-webkit-details-marker{display:none}
.racc>summary .no{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:rgba(95,208,196,.16);color:#5fd0c4;border:1px solid rgba(95,208,196,.5)}
.racc>summary .st{display:grid;flex:1;min-width:0;line-height:1.2}.racc>summary .st b{font-size:13px}.racc>summary .st small{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racc>summary .chev{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:0 4px 3px 0;transition:transform .2s}
.racc[open]>summary .chev{transform:rotate(225deg);margin-bottom:-3px}
.racc[open]{border-color:rgba(95,208,196,.55)}.racc[open]>summary{background:rgba(95,208,196,.1)}.racc[open]>summary .no{background:#5fd0c4;color:#062a26}
.racc>summary:hover{background:rgba(95,208,196,.08)}
.racc>summary.hl{box-shadow:inset 0 0 0 2px #f5b700;background:rgba(245,183,0,.12)}
.racc .rb{display:grid;gap:8px;padding:8px 10px 10px}
.pwbtn.on{background:#5fd0c4;color:#062a26;border-color:#5fd0c4}
.facc{margin-bottom:6px}.facc .rb.flist{gap:2px;padding:4px 4px 6px}.facc .forms{display:grid;gap:2px}
.sandbox #right .scroll>.sec:first-child,.sandbox #vInspire,.sandbox [data-go=inspireMe]{display:none!important}
.sbnote p{margin:4px 0 0;font-size:14.5px;line-height:1.5;color:var(--mute)}.sbnote p b{color:var(--txt)}
.spfeat.sbx{grid-template-columns:auto 1fr}.spfeat.sbx .sbico{width:120px;height:120px;border-radius:24px;display:grid;place-items:center;background:rgba(95,208,196,.12);border:2px solid #5fd0c4}
.spfeat.sbx .sbico svg{width:64px;height:64px;fill:none;stroke:#5fd0c4;stroke-width:1.6}
.nx .what{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.05);font-size:12.5px;line-height:1.45;color:var(--mute)}.nx .what b{color:var(--txt)}
.wact li{margin-bottom:6px}.wact .btn{margin-left:6px;vertical-align:middle}
#budget.flash{animation:bflash 1.2s ease-in-out 2}@keyframes bflash{50%{box-shadow:0 0 0 4px rgba(245,183,0,.6);border-radius:8px}}
.flrow{display:flex;gap:6px;flex-wrap:wrap}
.penrail{position:absolute;left:12px;top:318px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9}
.penrail .pmain{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;align-content:center;gap:2px;background:rgba(19,33,63,.96);border:1px solid var(--line-2);box-shadow:0 8px 22px rgba(0,0,0,.4);color:var(--txt);padding:0}
.penrail .pmain svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.penrail .pmain span{font-size:11px;font-weight:700}
.penrail.open .pmain{background:var(--gold);color:#1b1400;border-color:var(--gold)}
.penrail .psub:empty{display:none}
.penrail .psub{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border-radius:16px;background:rgba(19,33,63,.97);border:1px solid var(--line-2);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.penrail .pgrp{display:grid;grid-template-columns:repeat(2,auto);justify-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.penrail .pc{width:28px;height:28px;border-radius:50%;background:var(--pc);border:2px solid rgba(255,255,255,.25);padding:0;min-width:0;cursor:pointer}
.penrail .pc.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);transform:scale(1.08)}
.penrail .pt{width:50px;height:44px;border-radius:10px;display:grid;place-items:center;align-content:center;gap:1px;padding:0;background:transparent;border:1px solid transparent;color:var(--txt);cursor:pointer}
.penrail .pt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.penrail .pt span{font-size:10px;font-weight:700}
.penrail .pt:hover{background:rgba(255,255,255,.07)}.penrail .pt.on{background:var(--gold);color:#1b1400}
.penrail .pt.del{color:#ff8a8f}.penrail .pt.done{background:#5fd0c4;color:#062a26}
@media (max-height:760px){.penrail{top:auto;bottom:100px}.penrail .pt{height:34px}.penrail .pt span{display:none}}
.penrail .pt.save{color:#9ab6ff}
.svname{margin-top:10px;font-size:13px;color:var(--mute)}.svname code{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--txt);word-break:break-all}
.colchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:999px;background:rgba(95,208,196,.14);border:1px solid #5fd0c4;color:var(--txt);cursor:pointer}
.colchip b{font-family:var(--f-mono);letter-spacing:.12em;color:#5fd0c4}.colchip .dots{display:flex}.colchip .dots i{width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid var(--panel);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#0c1730}.colchip .dots i:first-child{margin-left:0}.colchip .dots i.more{background:var(--panel-3);color:var(--txt)}
#colBtn.on{background:#5fd0c4;color:#062a26}
.colpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.colpick .cbox{padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line-2)}.colpick h3{margin:0 0 4px;font-size:16px}.colpick p{margin:0 0 10px;color:var(--mute);font-size:13px}
.colgrid{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}.colgrid .qr{width:200px;height:200px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}.colgrid .qr svg{width:100%;height:100%}.colgrid .qr .tip{color:#3b4660;padding:14px;text-align:center}
.colurl{display:flex;gap:8px;align-items:center}.colurl code{flex:1;min-width:0;padding:6px 8px;border-radius:8px;background:var(--panel-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colpeople{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}.colpeople li{display:flex;align-items:center;gap:8px;font-size:14px}.colpeople i{width:12px;height:12px;border-radius:50%}.colpeople small{color:var(--mute)}.colpeople small.h{color:var(--gold);font-weight:700}
@media (max-width:820px){.colpick,.colgrid{grid-template-columns:1fr}.colchip .dots{display:none}}
.guide .gnote{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:rgba(95,208,196,.12);border:1px solid rgba(95,208,196,.45);font-size:12.5px;color:var(--txt)}
.penbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:14px;background:rgba(19,33,63,.97);border:1px solid var(--line-2);box-shadow:0 10px 26px rgba(0,0,0,.45);z-index:9;white-space:nowrap;max-width:calc(100% - 24px);overflow-x:auto}
.penbar>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:2px}
.penbar .pc{width:26px;height:26px;border-radius:50%;background:var(--pc);border:2px solid rgba(255,255,255,.25);padding:0;min-width:0}
.penbar .pc.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.penbar button:not(.pc){height:30px;padding:0 10px;font-size:12.5px}.penbar button.on:not(.pc){background:var(--gold);color:#1b1400}
.penbar .sep{width:1px;height:22px;background:var(--line-2);margin:0 2px}.penbar .done{background:#5fd0c4;color:#062a26}
.penbar .del{color:#ff8a8f}

function edgeOf(a,c,b){ const dx=c.x-a.x, dz=c.z-a.z, L=Math.hypot(dx,dz)||1e-6; if(!b) return {arc:false,a:[a.x,a.z],c:[c.x,c.z],len:L,d:[dx/L,dz/L]};

  const a0=Math.atan2(a.z-C[1],a.x-C[0]); let th=4*Math.atan(b); const tx=C[0]+R*Math.cos(a0+th/2), tz=C[1]+R*Math.sin(a0+th/2); if(Math.hypot(tx-(mx+lx*s2),tz-(mz+lz*s2))>1e-3*Math.max(1,L)) th=-th;

  const FL=furnLocked(), chips=K.add.map(a=>`<button class="btn sm" data-qa="${a[0]}:${a[1]}" ${FL?'disabled':''}>+ ${esc(addLabel(a))}</button>`).join('')+(FL?'<span class="tip" style="margin:4px 0 0;flex-basis:100%">You can add these once your Scenario cards are drawn.</span>':'');
  if(t==='Borrow') return `<div class="nx borrow"><div class="nh"><span>Borrow</span> Use ${esc(title)} as it is</div>
    <ol><li><b>Add the key pieces</b> to your room:<div class="qa">${chips}</div></li><li><b>Arrange them like the card</b>: ${K.el.map(esc).join(', ')}. Or let the game lay it out for you: <button class="btn sm primary" data-build="${n}" ${FL?'disabled':''}>Build this idea for me</button></li><li><b>Check your red card still passes</b> in Design checks on the right.</li></ol>
    <p class="what"><b>What happens when you tap a + button?</b> That piece is added to the middle of your room, ready to drag into place. <b>Build this idea for me</b> lays out the whole idea for you.</p>
    <p class="tip">Tip: borrowing works best when the idea already suits your room size and class size.</p></div>`;
  if(t==='Adapt'){ const kp=S.keep[n]||[]; return `<div class="nx adapt"><div class="nh"><span>Adapt</span> Keep the idea, change how it's done</div>
    <ol><li><b>Pick what you'll keep</b>:<div class="kp">${K.el.map((e,i)=>`<label class="ck"><input type="checkbox" data-keep="${n}:${i}" ${kp.includes(i)?'checked':''}> ${esc(e)}</label>`).join('')}</div></li>
    <li><b>Change the rest to fit</b>: <ul><li>Room too small? Use fewer pieces, or smaller ones of the same kind (small tables instead of long ones).</li><li>Need to switch layouts? Swap fixed pieces for ones on castors.</li><li>Mix it with another card you're borrowing.</li></ul></li>
    <li><b>Add the pieces you're keeping</b>:<div class="qa">${chips}</div></li></ol>
    <p class="what"><b>What happens when you tick a part?</b> It is saved to <b>Our Inspiration plan</b> on the right${kp.length?` (now: ${kp.map(i=>esc(K.el[i])).join(', ')})`:''}, and shows in your results so you can explain what you kept and what you changed.</p>
    <p class="tip">Tip: note what you changed and why. It makes a strong point in your pitch.</p></div>` }
  if(t==='Avoid'){ const w=S.avoidWhy[n]||[]; return `<div class="nx avoid"><div class="nh"><span>Avoid</span> Learn from what won't work here</div>
    <ol><li><b>Why doesn't it fit?</b> Pick one or more:<div class="qa">${Object.entries(AVOID_WHY).map(([k,[l]])=>`<button class="btn sm ${w.includes(k)?'on':''}" data-why="${n}:${k}">${esc(l)}</button>`).join('')}</div></li>
    <li><b>Make sure your design does the opposite</b>:${w.length?`<ul class="wact">${w.map(k=>`<li>${esc(AVOID_WHY[k][1])} <button class="btn sm" data-wa="${k}">${AVOID_ACT[k][0]}</button></li>`).join('')}</ul>`:' <span class="tip">pick a reason above to see what to watch for.</span>'}</li></ol>
    <p class="what"><b>What happens when you pick a reason?</b> It is saved to <b>Our Inspiration plan</b> on the right and in your results, and a button appears to help you check it in the room.</p></div>` }
  return '' }
function showNext(box,n,scroll){ if(!box)return; box.innerHTML=S.tags[n]?`<div class="nxwrap"><div class="lbl">What happens next · ${esc(INSP[n][0])}</div>${nextHTML(n)}</div>`:''; if(scroll&&S.tags[n])requestAnimationFrame(()=>box.scrollIntoView({behavior:'smooth',block:'nearest'})) }
function wireBAA(m,boxFn){ m.addEventListener('click',e=>{ if(colGuest()&&e.target.closest('[data-baa] [data-t],[data-why],[data-build],[data-qa]')){ e.stopImmediatePropagation(); toast(HOSTMSG); return }
  const b=e.target.closest('[data-baa] [data-t]'); if(b){ const n=+b.closest('[data-baa]').dataset.baa; S.tags[n]=S.tags[n]===b.dataset.t?undefined:b.dataset.t;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===S.tags[n])); showNext(boxFn(),n,true); renderHands(); renderPlan(); save(); return }
  const q=e.target.closest('[data-qa]'); if(q){ const [t,id]=q.dataset.qa.split(':'); if(t==='form') placeFormation(id); else addItem(id); toast(`${addLabel([t,id])} added to the room`); return }
  const bl=e.target.closest('[data-build]'); if(bl){ closeModal(); inspireDialog(+bl.dataset.build); return }
  const wa=e.target.closest('[data-wa]'); if(wa){ AVOID_ACT[wa.dataset.wa]?.[1](); return }
  const w=e.target.closest('[data-why]'); if(w){ const [n,k]=w.dataset.why.split(':'); const a=S.avoidWhy[n]=S.avoidWhy[n]||[]; const i=a.indexOf(k); if(i<0)a.push(k); else a.splice(i,1); showNext(boxFn(),+n); renderPlan(); save(); return } });
  m.addEventListener('change',e=>{ if(colGuest()&&e.target.closest('[data-keep]')){ e.target.checked=!e.target.checked; toast(HOSTMSG); return } const c=e.target.closest('[data-keep]'); if(!c)return; const [n,i]=c.dataset.keep.split(':').map(Number); const a=S.keep[n]=S.keep[n]||[]; const j=a.indexOf(i); if(c.checked&&j<0)a.push(i); if(!c.checked&&j>=0)a.splice(j,1); renderPlan(); save() }) }
/* the team's idea plan, always visible under the inspiration cards */
function renderPlan(){ const el=$('#plan'); if(!el)return; const T=Object.entries(S.tags||{}).filter(([,t])=>t);
  el.innerHTML=T.length?`<div class="lbl" style="margin:2px 0 6px">Our Inspiration plan</div>`+T.map(([n,t])=>{ n=+n; const K=INSP_KEY[n]||{el:[]};
    const line=t==='Borrow'?`Add and arrange: ${K.el.join(', ')}`:t==='Adapt'?((S.keep[n]||[]).length?`Keep: ${(S.keep[n]||[]).map(i=>K.el[i]).join(', ')}`:'Pick what to keep'):((S.avoidWhy[n]||[]).length?`Because: ${(S.avoidWhy[n]||[]).map(k=>AVOID_WHY[k][0].toLowerCase()).join(', ')}`:'Pick why it won\'t fit');
    return `<button class="pl ${t.toLowerCase()}" data-pl="${n}"><span>${t}</span><b>${esc(INSP[n][0])}</b><small>${esc(line)}</small></button>` }).join(''):'' }

/* ===== "Follow this": the team's challenge and the prompt to work on now, pinned on the room view ===== */
function renderMission(){ const el=$('#mission'); if(!el||!S)return; const R=S.hand.r, G=S.hand.g; if(S.promptAt>=G.length)S.promptAt=Math.max(0,G.length-1);
  if(!R.length&&!G.length){ el.hidden=true; return } el.hidden=false;
  const p=G[S.promptAt];
  el.innerHTML=`<div class="mh"><span>Follow this</span><button class="iconbtn" data-ms="min" aria-label="Collapse" style="width:24px;height:24px"><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="${el.classList.contains('min')?'M6 9l6 6 6-6':'M6 15l6-6 6 6'}"/></svg></button></div>
    <div class="mb">${R.length?`<button class="mrow r" data-ms="r"><i></i><span><small>${R.length>1?`Scenarios (${R.length})`:'Scenario'}</small><b>${R.map(n=>esc(SCEN[n-1][0])).join(' · ')}</b></span></button>`:''}
    ${p?`<button class="mrow g" data-ms="g"><i></i><span><small>Prompt ${S.promptAt+1} of ${G.length} · extra challenge</small><b>${esc(PROMPTS[p-1])}</b><em class="mtry">Try this: ${esc(PROMPT_DO[p-1]||'')}</em></span></button>
    ${G.length>1?`<div class="mact"><button class="btn sm" data-ms="prev" ${S.promptAt?'':'disabled'}>Back</button><button class="btn sm green" data-ms="next" ${S.promptAt<G.length-1?'':'disabled'}>Done, next prompt</button></div>`:''}`:''}</div>` }
$('#mission').addEventListener('click',e=>{ const a=e.target.closest('[data-ms]')?.dataset.ms; if(!a)return;
  if(a==='min'){ $('#mission').classList.toggle('min'); renderMission(); return } if(a==='r')handDialog('r',false); if(a==='g')handDialog('g',false);
  if((a==='next'||a==='prev')&&hostOnly())return;
  if(a==='next'&&S.promptAt<S.hand.g.length-1){ S.promptAt++; renderMission(); renderHands(); save(); toast('Next prompt: '+PROMPTS[S.hand.g[S.promptAt]-1]) }
  if(a==='prev'&&S.promptAt>0){ S.promptAt--; renderMission(); renderHands(); save() } });

/* ===== project id: made once when a game starts; goes into saves and exports (and later a Google Sheet) ===== */
function newPid(){ const d=new Date(), p=n=>String(n).padStart(2,'0'), A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let r=''; const b=new Uint8Array(4); (crypto?.getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.random()*256)); for(const x of b)r+=A[x%A.length]; return `SDK-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${r}` }

/* ===== timer helpers: pause, time's up, +5 min extensions, hold while scoring ===== */
let timesUpPending=false, MODAL_CLOSE_HOOK=null;
function setPaused(v){ S.paused=!!v; $('#tPauseIc').setAttribute('d',S.paused?'M8 5l11 7-11 7z':'M9 5v14M15 5v14'); $('#timer').classList.toggle('paused',S.paused) }
const stepLeft=()=>step().dur+(S.extra||0)-S.stepElapsed;
function clockOff(on){ S.clockOff=!!on; if(on){ S.upShown=false; timesUpPending=false; $('#timer').classList.remove('up'); setPaused(false) } else { const left=stepLeft(); if(left<300)S.extra=(S.extra||0)+(300-left); S.upShown=false; setPaused(false) } renderTimer(); renderCatalog(); save(); toast(on?'Clock off. Take your time to keep improving. Tap the clock to turn it back on.':'Clock back on with 5 minutes.') }
function extendStep(){ if(colGuestTimed()){ toast('The host runs the timer.'); return } S.extra=(S.extra||0)+300; S.upShown=false; timesUpPending=false; $('#timer').classList.remove('up'); setPaused(false); renderTimer(); save(); toast(`+5 minutes added to ${step().name}.`) }
function renderTimer(){ if(!S||S.mode==='free')return; $('#timer').classList.toggle('off',!!S.clockOff); if(S.clockOff){ $('#tval').textContent='Clock off'; $('#tExt').hidden=true; $('#timer').classList.remove('over','up'); return } const left=stepLeft(); $('#tval').textContent=fmt(Math.max(0,left)); $('#timer').classList.toggle('over',left<=0); $('#tExt').hidden=!S.upShown||!!step().max }
function timesUpDialog(){ const st=step(), nx=steps()[S.step+1], ext=Math.round((S.extra||0)/300), miss=cardsMissing(S.step,S.step+1);
  const m=modal(`<div class="hd"><div class="kick">Step ${S.step+1} · ${esc(st.name)}</div><h2>Time's up!</h2><p class="lead" style="margin:6px 0 0">${esc(st.name)} has used its ${Math.round(st.dur/60)} minutes${ext?` and ${ext*5} extra minute${ext*5>1?'s':''}`:''}. The timer is paused.</p></div>
   <div class="bd"><p style="margin:0">${miss?'Draw your cards before you move on.':st.max?`Room setup has a ${Math.round(st.dur/60)}-minute limit. Time to start the round.`:'Need a little longer? Keep improving adds 5 minutes, and you can do it as many times as you need.'}</p></div>
   <div class="ft">${st.max?'':'<button class="btn" id="tuExt" title="Add 5 more minutes to this step">Keep improving · +5 min</button>'}<button class="btn primary" id="tuNext">${miss?`Draw ${miss.need} card${miss.need>1?'s':''}`:nx?`Move on to ${esc(nx.name)}`:'Finish the game'}</button></div>`);
  m.querySelector('#tuExt')?.addEventListener('click',()=>{ closeModal(); extendStep() });
  m.querySelector('#tuNext').onclick=()=>{ closeModal(); if(miss){ draw(miss.k); return } if(nx) goStep(S.step+1); else finish() } }
// scoring dialogs hold the clock until the team closes them
function holdTimer(){ if(!S||S.mode==='free'||MODAL_CLOSE_HOOK)return; const was=S.paused; setPaused(true); $('#timer').classList.add('held');
  MODAL_CLOSE_HOOK=()=>{ $('#timer').classList.remove('held'); if(!was&&!S.upShown)setPaused(false) }; toast('Timer paused while you score.') }

/* ===== moving between steps always asks first, and never while the room shape is being drawn ===== */
const NEED={challenge:'r',ideas:'b',prompt:'g',aware:'r',inspire:'b',explore:'g'};
function cardsMissing(from,to){ for(let j=from;j<to;j++){ const k=NEED[steps()[j]?.id]; if(!k)continue; const want=Math.min(MODES[S.mode].limits[k],S.hand[k].length+S.deck[k].length); if(S.hand[k].length<want)return {k,j,need:want-S.hand[k].length} } return null }
const FREE_SEQ=['r','b','g','score'], FREE_NAME={r:'Scenario',b:'Inspiration',g:'Prompt',score:'Score it'};
function freeNext(){ if(hostOnly())return; const at=S.freeStep||0, k=FREE_SEQ[at], nx=FREE_SEQ[at+1]; if(!nx)return;
  if(k!=='score'){ const want=Math.min(MODES.free.limits[k],S.hand[k].length+S.deck[k].length); if(S.hand[k].length<want){ needCardsDialog({k,j:-1,need:want-S.hand[k].length,free:1}); return } }
  const m=modal(`<div class="hd"><div class="kick">Free build</div><h2>Move on to ${FREE_NAME[nx]}?</h2><p class="lead" style="margin:6px 0 0">Make sure your team has finished with the ${FREE_NAME[k]} cards first.</p></div>
   <div class="ft"><button class="btn ghost" data-close>Not yet</button><button class="btn primary" id="fnGo">Yes, move on</button></div>`);
  m.querySelector('#fnGo').onclick=()=>{ S.freeStep=at+1; closeModal(); renderGuide(); renderHands(); save(); if(nx==='score')toast('Score it is open. Press it when your design is ready.') } }
function needCardsDialog(miss){ if(miss.free){ const deck={r:'red Scenario',b:'blue Inspiration',g:'green Prompt'}[miss.k];
    const m=modal(`<div class="hd"><div class="kick">Free build</div><h2>Draw your cards first</h2><p class="lead" style="margin:6px 0 0">Draw your ${deck} cards before moving on.</p></div><div class="ft"><button class="btn ghost" data-close>Not now</button><button class="btn primary" id="ncGo">Draw ${miss.need} card${miss.need>1?'s':''}</button></div>`);
    m.querySelector('#ncGo').onclick=()=>{ closeModal(); draw(miss.k) }; return } const st=steps()[miss.j], here=miss.j===S.step, deck={r:'red Scenario',b:'blue Inspiration',g:'green Prompt'}[miss.k];
  const m=modal(`<div class="hd"><div class="kick">Step ${miss.j+1} · ${esc(st.name)}</div><h2>Draw your cards first</h2><p class="lead" style="margin:6px 0 0">${here?`You can't move on until you draw your ${deck} card${miss.need>1?'s':''}.`:`${esc(st.name)} needs its ${deck} card${miss.need>1?'s':''} before you can skip ahead.`}</p></div>
    <div class="ft"><button class="btn ghost" data-close>Not now</button><button class="btn primary" id="ncGo">${here?`Draw ${miss.need} card${miss.need>1?'s':''}`:`Go to ${esc(st.name)}`}</button></div>`);
  m.querySelector('#ncGo').onclick=()=>{ closeModal(); if(here)draw(miss.k); else goStep(miss.j) } }
function askStep(i){ if(!S||S.mode==='free')return; if(i===S.step)return; if(hostOnly())return;
  if(i>S.step){ const miss=cardsMissing(S.step,Math.min(i,steps().length)); if(miss){ needCardsDialog(miss); return } }
  if(DRAW){ toast('Finish editing the room first: press Done or Cancel on the drawing bar.'); return }
  if(i>=steps().length){ const m=modal(`<div class="hd"><div class="kick">Last step</div><h2>Finish the game?</h2><p class="lead" style="margin:6px 0 0">You'll see the summary of your design. Check your team is done first.</p></div><div class="ft"><button class="btn ghost" data-close>Not yet</button><button class="btn primary" id="asGo">Finish</button></div>`); m.querySelector('#asGo').onclick=()=>{closeModal();finish()}; return }
  const cur=step(), to=steps()[i], left=stepLeft(), back=i<S.step;
  if(cur.id==='hook'&&!back){ const n=k=>S.fix.filter(f=>f.kind===k).length, pw=S.fix.filter(f=>f.kind==='socket').length+S.items.filter(x=>DEF[x.type].sockets).length, area=polyArea(ROOMPOLY());
    const row=(ok,t,d)=>`<li class="${ok?'ok':'no'}"><span>${ok?'✓':'!'}</span><b>${t}</b><small>${d}</small></li>`;
    const m=modal(`<div class="hd"><div class="kick">Step 1 · Hook</div><h2>Is your room layout and design done?</h2><p class="lead" style="margin:6px 0 0">Next comes your Scenario. Check the room is how you want it first.${left>0?` You still have ${fmt(left)} left.`:''}</p></div>
      <div class="bd"><ul class="rdone">${row(true,'Size and shape',`${area.toFixed(0)} m² · ${isShape()?'custom shape':RW_()+' × '+RD_()+' m'}`)}${row(n('door')>=2,'Doors',n('door')+(n('door')<2?' · two doors give a safe way out':''))}${row(n('window')>0,'Windows',n('window')+'')}${row(pw>0,'Power points',pw+' socket'+(pw===1?'':'s'))}${row(n('board')>0,'Whiteboard',n('board')?'placed':'none yet')}</ul>
      <label class="ck" style="margin-top:12px"><input type="checkbox" id="asLock" ${S.lockRoom?'checked disabled':'checked'}> Lock the room so it does not move by accident (you can unlock it any time)</label></div>
      <div class="ft"><button class="btn ghost" data-close>Not yet, keep designing</button><button class="btn primary" id="asGo">Yes, the room is done</button></div>`);
    m.querySelector('#asGo').onclick=()=>{ const lk=m.querySelector('#asLock')?.checked; closeModal(); if(lk&&!S.lockRoom)setSpaceLock(true,false); goStep(i) }; return }
  const m=modal(`<div class="hd"><div class="kick">Step ${S.step+1} · ${esc(cur.name)}</div><h2>${back?'Go back to':'Move on to'} ${esc(to.name)}?</h2>
    <p class="lead" style="margin:6px 0 0">${back?`You can go back to fix something. The timer for ${esc(to.name)} starts again.`:`You still have ${left>0?fmt(left):'no time'} left in ${esc(cur.name)}. Make sure everyone in your team is ready before moving on.`}</p></div>
    <div class="ft"><button class="btn ghost" data-close>Stay in ${esc(cur.name)}</button><button class="btn primary" id="asGo">${back?'Go back':'Yes, move on'}</button></div>`);
  m.querySelector('#asGo').onclick=()=>{ closeModal(); goStep(i) } }

  async function go(){ stopRender(true); st.textContent='Loading the renderer…'; goB.textContent='Back to preview'; stp.hidden=false; stp.textContent='Pause'; sv.hidden=true; bar.style.width='0%';
    let mod; try{ mod=await loadPT() }catch(e){ st.textContent='The renderer could not load here. Check your internet connection and try again.'; return } if(!$('#rnd'))return;
    st.textContent='Setting up the scene…';
    setTimeout(()=>{ if(!$('#rnd'))return; try{
      const w=fit(), h=Math.round(w*9/16), Q=RQUAL[qual]; const nc=document.createElement('canvas'); nc.id='rnC'; cv.replaceWith(nc); cv=nc; cv.style.width=w+'px'; cv.style.height=h+'px'; img.hidden=true;
      const r=new THREE.WebGLRenderer({canvas:cv,antialias:false,preserveDrawingBuffer:true}); r.setPixelRatio(1); r.setSize(w,h,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=(view==='eye'||view.startsWith('cam:'))?1:.8; r.outputColorSpace=THREE.SRGBColorSpace;
      const cam=renderCams(view,w/h), built=buildRenderScene(view,cam);
      const pt=new mod.WebGLPathTracer(r); pt.renderScale=Q.scale; pt.tiles.set(2,2); pt.bounces=view==='cut'||view==='this'?5:6; pt.filterGlossyFactor=.5; pt.minSamples=2; pt.renderDelay=0; pt.fadeDuration=250; pt.dynamicLowRes=true; pt.lowResScale=.15;
      pt.setScene(built.R,cam);

    }catch(e){ console.error(e?.stack||e); st.textContent='This device could not run the realistic renderer. Try Draft quality, or a computer with a graphics card.'; stopRender(true); RENDERING=false } },40) }
  refresh() }

let lastT=performance.now(), lastSave=0;
function tick(now){
  const dt=(now-lastT)/1000; lastT=now;
  if(S&&S.mode!=='free'&&!S.paused&&!S.finished&&!S.clockOff&&!startOpen&&!colGuestTimed()){
    S.stepElapsed+=dt; const st=step(); const left=stepLeft();
    if(left<=0&&!S.upShown){ S.stepElapsed=st.dur+(S.extra||0); S.upShown=true; setPaused(true); $('#timer').classList.add('up'); timesUpPending=true; renderCatalog(); save() }
    renderTimer();
    if(st.twist&&!S.twistDone&&S.stepElapsed>=st.twist){ S.twistDone=true; toast('Twist! A prompt card has been drawn. Follow it on the room view.'); draw('g') }
    if(st.nudge){ for(const t of st.nudge){ if(S.stepElapsed>=t&&!S.nudged.includes(t)){ S.nudged.push(t); if(S.hand.g.length&&S.promptAt<S.hand.g.length-1){ S.promptAt++; renderMission(); renderHands(); toast('Time for the next prompt: '+PROMPTS[S.hand.g[S.promptAt]-1]) } else if(!S.hand.g.length) toast('Time to draw your green Prompt cards.') } } }
    if(now-lastSave>5000){lastSave=now;save()}
  }
  if(timesUpPending&&S&&!$('#mdl')&&!startOpen){ timesUpPending=false; timesUpDialog() }
}

function checkHint(key){
  const c=lastCheck.ctx, L=lastCheck.list; if(!c)return '';
  const req=L.filter(x=>x.req), allOK=req.every(x=>x.ok);
  const map={needs:[c.seats>=c.cls&&(c.wheelOK||!S.hand.r.includes(5)),`Seats ${c.seats}/${c.cls}`],
    ease:[c.mobileRatio>=.5,`${Math.round(c.mobileRatio*100)}% mobile furniture`],
    sustain:[c.cost<=c.budgetCap,`${money(c.cost)} of ${money(c.budgetCap)}`],
    clarity:[S.items.length>0&&allOK,`${S.items.length} items listed · ${req.filter(x=>x.ok).length}/${req.length} checks pass`]};
  const h=map[key]; if(!h)return ''; return `<span class="hint ${h[0]?'pass':'fail'}">Game check: ${esc(h[1])}</span>`;
}

function scoreNow(){

function wcTick(now){ const dt=Math.min(.1,(now-(wcLast||now))/1000); wcLast=now; if(!WC)return; const f=(WCK.has('w')?1:0)-(WCK.has('s')?1:0), t=(WCK.has('a')?1:0)-(WCK.has('d')?1:0); if(!f&&!t)return;

  let hit=wcBlocked(nx,nz,nr), ok=!hit;
  if(hit&&t&&!wcBlocked(x,z,nr)){ WC.rot=nr; ok=true; hit=null }
  else if(ok){ WC.x=nx; WC.z=nz; WC.rot=nr; WC.moved+=Math.hypot(nx-x,nz-z) }
  WC.g.position.set(WC.x,0,WC.z); WC.g.rotation.y=WC.rot;
  const col=hit?0xff3b3b:0x5fd0c4; WC.g.userData.ring.material.color.set(col); WC.g.userData.foot.material.color.set(col);
  if(hit&&now-WC.bumpT>900){ WC.bumpT=now; WC.bumps++; const m=$('#wcMsg'); if(m)m.textContent=hit==='wall'?'Bump! A wall is in the way.':`Bump! ${hit} is in the way. A wheelchair needs about 0.9 m to pass and 1.5 m to turn.` }

  withFloor({room,fix:[],items:[],inner:[],zones:[],groups:{},cams:[],boardSet:true},()=>{ fix=defaultFix(room,S.uid).filter(f=>f.kind!=='door') }); S.uid+=fix.length+2;
  S.floorStore=S.floorStore||{}; S.floorStore[1]={room,fix,items:[],inner:[],zones:[],groups:{},cams:[],boardSet:true,ink:[],cost:0}; S.nFloors=2; switchFloor(1);

function removeFloor(){ if((S.nFloors||1)<2)return; const m=modal(`<div class="hd"><div class="kick">Sandbox · Floors</div><h2>Remove Level 2?</h2><p class="lead" style="margin:6px 0 0">Everything on Level 2 will be deleted. This cannot be undone.</p></div><div class="ft"><button class="btn ghost" data-close>Keep it</button><button class="btn primary" id="flDel" style="background:var(--red);border-color:var(--red)">Remove Level 2</button></div>`);

/* stairs and lifts on the ground floor show up on Level 2 as an opening / the same lift */
function syncStairs(){ if((S.nFloors||1)<2)return; const f1=S.floor===0?S.items:S.floorStore[0]?.items, f2=S.floor===1?S.items:S.floorStore[1]?.items; if(!f1||!f2)return;

  for(const st of f1.filter(i=>i.type==='stair'||i.type==='lift')){ const want=st.type==='stair'?'void':'lift'; if(!f2.some(o=>o.type===want&&near(o,st))) f2.push({uid:S.uid++,type:want,x:st.x,z:st.z,rot:st.rot||0,link:1}) }
  for(let i=f2.length-1;i>=0;i--){ const o=f2[i]; if(o.type==='void'&&!f1.some(st=>st.type==='stair'&&near(o,st)))f2.splice(i,1) } }

function inkMesh(st){ const g=new THREE.Group(), P=st.p, w=st.w/2, y=.05, mat_=new THREE.MeshBasicMaterial({color:st.c,transparent:true,opacity:.92,depthTest:false,depthWrite:false,side:THREE.DoubleSide});

canvas.addEventListener('pointerdown',e=>{ if(!PEN)return; e.stopImmediatePropagation(); const q=penPt(e); if(!q)return;
  if(PEN.erase){ let bi=-1,bd=.35; (S.ink||[]).forEach((st,i)=>{ for(let k=0;k<st.p.length;k++){ const d=Math.hypot(st.p[k][0]-q[0],st.p[k][1]-q[1]); if(d<bd){bd=d;bi=i} } }); if(bi>=0){ S.ink.splice(bi,1); buildInk(); save() } return }

/* ===== saving: one place for every file the game makes (sketches, reports, renders, layouts) =====
   PC (Chrome / Edge): a "Space Design Kit" folder, made inside the folder the person picks once (Desktop suggested).
   iPad / iPhone / Android: the share sheet (Save to Files / Photos / Drive). Anything else, or if those are blocked: a normal download. */
const slugS=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

const _AT={};

function updateMoveG(){ moveG.visible=false; if(!S||DRAW||WC||RENDERING||placingCam)return;
  if(selected!=null){ const it=itemBy(selected); if(!it||isLockedIt(it))return; const d=DEF[it.type]; if(isCeilT(it.type)?S.lockRoom:S.lockFurn)return;
    const set=lockSet(it); let x=0,z=0,ext=0; for(const m of set){ x+=m.x; z+=m.z } x/=set.length; z/=set.length; for(const m of set){ const dm=dims(m); ext=Math.max(ext,Math.hypot(m.x-x,m.z-z)+Math.max(dm.w,dm.d)/2) }
    if(d.wall){ const nw=nearestWall(it.x,it.z); if(nw){ const tg=wallTan(nw.wall,nw.t), n=wallN(nw.wall,nw.t); setMoveG(it.x+n[0]*.45,it.z+n[1]*.45,1.1,false,tg[0],tg[1]) } return }

  if(selWall!=null&&wallLen(selWall)){ const L=wallLen(selWall), t=selWallT?.w===selWall?selWallT.t:L/2, [px,pz]=wallPt(selWall,t), n=wallN(selWall,t);
    if(wInner(selWall)&&(iMoveRoom||selRoomWhole)){ const r=innerOf(selWall), P=r?innerCache(r).P:null; if(P){ const cx=P.reduce((a,q)=>a+q[0],0)/P.length, cz=P.reduce((a,q)=>a+q[1],0)/P.length; setMoveG(cx,cz,1.4,true); return } } setMoveG(px+n[0]*.7,pz+n[1]*.7,1.6,false,n[0],n[1]); return }
  if(selZone!=null){ const zn=S.zones.find(q=>q.uid===selZone); if(zn)setMoveG((zn.x0+zn.x1)/2,(zn.z0+zn.z1)/2,Math.max(.8,Math.min(2,Math.min(zn.x1-zn.x0,zn.z1-zn.z0)*.6)),true) } }
/* the pointer turns into a move cursor over anything that can be dragged */
let _hovT=0;

window.__sd={inspire(n,seed,ch){const t=performance.now();const r=inspireBuild(n,seed,ch||'kchair');r.ms=Math.round(performance.now()-t);return r},bad(){return [...objs].filter(([u,g])=>g.userData.bad).map(([u])=>{const i=S.items.find(t=>t.uid===u);return [i.type,i.grp,i.gi,i.x,i.z,i.rot]})},cam(px,py,pz,tx,ty,tz){camera.position.set(px,py,pz);orbit.target.set(tx,ty,tz);orbit.update()},look(x,z,d){camera.position.set(x-d*.35,d*.75,z+d*.85);orbit.target.set(x,.4,z);orbit.update()},dg(){return drawG.children.map(c=>c.type+':'+JSON.stringify(c.userData)).join(' ')},pickAt(cx,cy){setNdc({clientX:cx,clientY:cy});return JSON.stringify(pick())},hitAt(cx,cy){setNdc({clientX:cx,clientY:cy});return [floorHit(),ray.intersectObjects(drawG.children,false).map(h=>JSON.stringify(h.object.userData)).filter(x=>x!=='{}')]},hitDraw(x,z){tmpV.set(x,0,z).project(camera);ndc.set(tmpV.x,tmpV.y);ray.setFromCamera(ndc,camera);return ray.intersectObjects(drawG.children,false).map(h=>JSON.stringify(h.object.userData))},go(i){goStep(i)},drawK(k){S.mode==='free'&&(S.freeStep=9);draw(k)},get PW(){return PW},sel(u){select(u)},get COL(){return COL},get S(){return S},get DRAW(){return DRAW},get drag(){return drag},get lastCheck(){return lastCheck},proj(x,y,z){tmpV.set(x,y,z).project(camera);const r=canvas.getBoundingClientRect();return[r.left+(tmpV.x+1)/2*r.width,r.top+(1-tmpV.y)/2*r.height]}};
