<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Space Design Kit 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: drafting-table game. Catalog left, 1:20 model room centre, cards + checks right. Single committed dark look. */
:root{
  --bg:#0c1730; --panel:#13213f; --panel-2:#1a2b4f; --panel-3:#22365f; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --txt:#eef2fa; --mute:#9fb0cf; --dim:#6f82a6;
  --red:#e3262f; --red-s:rgba(227,38,47,.16); --blue:#3a6df0; --blue-s:rgba(58,109,240,.18); --green:#22a24a; --green-s:rgba(34,162,74,.18);
  --gold:#f5b700; --gold-s:rgba(245,183,0,.16); --ok:#3ccf74; --warn:#f5b700; --bad:#ff5a5f;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--txt);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:56px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:56px 1fr;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mark{width:30px;height:30px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;background:var(--panel-3)}
.brand .mark i{border-radius:2px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.steps{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute);border:1px solid transparent}
.stp i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel-3);color:var(--mute)}
.stp.done i{background:var(--ok);color:#06210f}
.stp.cur{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
.stp.cur i{background:var(--gold);color:#1b1400}
.timer #tExt{display:inline-flex;align-items:center;padding:4px 8px;border-radius:7px;background:var(--gold);color:#1b1400;font-weight:800;font-size:12px}
.timer #tExt[hidden]{display:none}
.timer.paused .t{opacity:.6}
.timer.held:after{content:'Scoring';font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
#steps.locked .stp:not(.cur){opacity:.4;cursor:not-allowed}
.timer{flex:none;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:18px;min-width:62px;text-align:right}
.timer.over .t{color:var(--bad)}
.timer button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.timer button:hover{background:var(--panel-3);color:var(--txt)}
.budget{flex:none;min-width:170px}
.budget .row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute);font-weight:600}
.budget .row b{color:var(--txt);font-family:var(--f-mono)}
.budget .bar{height:6px;border-radius:4px;background:var(--panel-3);margin-top:4px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.budget.over .bar i{background:var(--bad)} .budget.over .row b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--panel-3);border:1px solid var(--line-2);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--gold);color:#1b1400;border-color:transparent}
.btn.red{background:var(--red);border-color:transparent}.btn.blue{background:var(--blue);border-color:transparent}.btn.green{background:var(--green);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.iconbtn:hover{background:var(--panel-3)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* main */
.main{display:grid;grid-template-columns:260px 1fr 330px;min-height:0}
.side{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.side.left{border-right:1px solid var(--line)} .side.right{border-left:1px solid var(--line)}
.sec{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.scroll{overflow-y:auto;min-height:0;flex:1}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.lhead h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--txt)}
.lhead .cnt{font-size:11.5px;color:var(--mute);background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.lsearch{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:0 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2)}
.lsearch:focus-within{border-color:var(--gold)}
.lsearch .ic{width:16px;height:16px;flex:none;color:var(--mute)}
.lsearch input{border:0;background:transparent;padding:9px 0;outline:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px 12px;border-bottom:1px solid var(--line)}
.lfoot{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.lfoot b{color:var(--txt);font-weight:700}
.lbl.sub{margin:10px 4px 6px;font-size:10.5px}
.it .tx{min-width:0}
.it .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.it .chips em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.02em;color:#c7d2e6;background:var(--panel-3);padding:1px 6px;border-radius:4px}
.cat{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;font-size:11px;font-weight:700;color:var(--mute);background:var(--panel-2);border:1px solid transparent}
.cat .ic{width:18px;height:18px}
.cat:hover{color:var(--txt);border-color:var(--line-2)}
.cat.on{background:var(--txt);color:var(--bg)}
.items{padding:8px;display:grid;gap:4px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:1px solid transparent}
.it:hover{background:var(--panel-2);border-color:var(--line)}
.side.left{position:relative}
.side.left.trash:after{content:"Drop here to remove";position:absolute;inset:8px;border:2px dashed var(--bad);border-radius:14px;background:rgba(255,90,95,.16);display:grid;place-items:center;font-weight:800;font-size:16px;color:#ffd0d2;z-index:5;pointer-events:none}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-130%);background:var(--gold);color:#1b1400;font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);white-space:nowrap}
.it{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
html,body{overscroll-behavior:none}
.scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.side.left.peek{transform:translateX(-105%);transition:transform .15s}
.tgp{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin:0 2px 8px}
.tgp button{flex:1;padding:6px 8px;font-size:12px;font-weight:700;background:var(--panel-2)}
.tgp button.on{background:var(--gold);color:#1b1400}
.forms{border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:6px}
.forms .fp{background:#f6f7f9}
.roomp{padding:6px 6px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.roomp p{margin:0;font-size:12px;color:var(--mute)}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.irow small{display:block;color:var(--mute);font-size:11.5px}
.roomp.locked [data-ir=rect],.roomp.locked [data-ir=draw]{opacity:.35;pointer-events:none}
.shapeinfo{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.shapeinfo span{color:var(--mute);font-size:12px}
.roomp.locked [data-sh]{opacity:.35;pointer-events:none}
.drawbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:calc(100% - 28px);background:rgba(19,33,63,.96);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.4);z-index:6}
.drawbar b{font-family:var(--f-display);font-size:16px;margin-right:4px}
.drawbar .hint{font-size:12px;color:var(--mute);flex-basis:100%}
.drawbar{flex-direction:column;align-items:stretch;width:min(720px,calc(100% - 28px))}
.drawbar .dtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.drawbar .dtop .btn.primary{margin-left:auto}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.howto>div{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:12.5px;color:#d3dbea;padding:8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.howto b{display:block;color:var(--txt);font-size:13px;margin-bottom:2px}
.howto .hk{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--panel-3);font-weight:800;font-size:13px}
.howto.steps3>div{opacity:.55}.howto.steps3>div.on{opacity:1;border-color:var(--gold)}.howto.steps3>div.done{opacity:.8}.howto.steps3>div.done .hk{background:var(--green);color:#06210f}
.howto.edit{grid-template-columns:repeat(2,minmax(0,1fr))}
.howto>div>span{min-width:0}
.howto .cyc{display:flex;align-items:center;gap:2px;margin:4px 0}.howto .cyc i{font-style:normal;color:var(--mute);font-size:11px}
.hud.drawing .mission{display:none}
.toast{z-index:40}
.hud.drawing .toast{top:auto;bottom:96px}
.rhelp{font-size:12px;color:var(--mute);margin:0}.rhelp b{color:var(--txt)}
.drawbar .tg{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.drawbar .tg button{padding:6px 10px;font-size:12.5px;font-weight:700;background:var(--panel-2)}
.drawbar .tg button.on{background:var(--gold);color:#1b1400}
.drawtip{position:absolute;pointer-events:none;background:var(--txt);color:var(--bg);font-weight:700;font-size:12px;padding:4px 8px;border-radius:7px;transform:translate(14px,14px);white-space:nowrap;font-family:var(--f-mono)}
.guide.hide-draw{display:none}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.roomp.locked .rsz button,.roomp.locked .rfix .btn,.roomp.locked [data-imp],.roomp.locked [data-rz=reset]{opacity:.35;pointer-events:none}
.rsz button[disabled]{opacity:.35}
.rsz{display:grid;grid-template-columns:52px 32px 1fr 32px;align-items:center;gap:6px;font-size:13px}
.rsz span{color:var(--mute);font-weight:600}
.rsz b{text-align:center;font-weight:700}
.rsz button{height:32px;border-radius:8px;background:var(--panel-3);border:1px solid var(--line-2);font-weight:800;font-size:16px}
.rfix{display:flex;flex-wrap:wrap;gap:6px}
.rfix small{color:var(--mute);font-family:var(--f-mono)}
.seltool .rot{display:flex;align-items:center;gap:6px;padding:0 4px}
.seltool .rot input{width:110px;padding:0;accent-color:var(--gold);background:none;border:0}
.seltool .rot span{font-size:12px;min-width:34px;color:var(--txt)}
.it .fp{width:44px;height:36px;border-radius:7px;background:#eef1f5;display:grid;place-items:center}
.it b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.it small{color:var(--mute);font-size:11.5px}
.it .p{font-family:var(--f-mono);font-size:12px;color:var(--txt);font-weight:500}
.note-s{font-size:11.5px;color:var(--dim);padding:10px 14px 14px;line-height:1.45}

.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 40%,#1a2c55 0%,#0c1730 70%)}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud > *{pointer-events:auto}
.guide{position:absolute;left:14px;top:14px;max-width:380px;background:rgba(19,33,63,.94);backdrop-filter:blur(6px);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.guide .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.guide h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:3px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.guide p{margin:0 0 6px;color:#d3dbea;font-size:13.5px}
.guide ul{margin:4px 0 8px;padding-left:18px;color:#d3dbea;font-size:13px}
.guide .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.guide .min{position:absolute;right:8px;top:8px}
.guide.collapsed{padding:10px 14px}
.guide.collapsed > :not(.k):not(h2):not(.min){display:none}
.guide.collapsed h2{font-size:16px;margin:2px 28px 0 0}
.views{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:flex-end;gap:6px;max-width:calc(100% - 24px);padding:6px;border-radius:16px;background:rgba(15,27,54,.94);backdrop-filter:blur(6px);border:1px solid var(--line-2);box-shadow:0 14px 34px rgba(0,0,0,.4);pointer-events:auto}
.views{overflow-x:auto;scrollbar-width:none}.views::-webkit-scrollbar{display:none}
.dock>*{flex:none}
.dock .dgrp{display:grid;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
.dock .dgrp small{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-left:4px}
.dock .dgrp>div{display:flex;gap:2px}
.dk{display:grid;justify-items:center;align-content:center;gap:3px;min-width:58px;height:50px;padding:4px 6px;border-radius:10px;font-size:11px;font-weight:700;color:#d3dbea;white-space:nowrap}
.dk .ic{width:19px;height:19px}
.dk:hover:not(:disabled){background:var(--panel-3);color:var(--txt)}
.dk.on{background:var(--txt);color:var(--bg)}
.dk:disabled{opacity:.4}
.dk.hero{height:58px;min-width:72px;background:var(--gold);color:#1b1400;font-size:12px}
.dk.hero:hover{background:#ffc928;color:#1b1400}

.scale{position:absolute;left:14px;bottom:84px;font-size:11.5px;color:var(--mute);background:rgba(19,33,63,.85);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.scale b{color:var(--txt)}
.seltool{position:absolute;display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.4);transform:translate(-50%,-100%);white-space:nowrap}
.seltool .nm{font-size:12px;font-weight:700;padding:0 8px;display:flex;align-items:center;color:var(--mute)}
.seltool button{height:32px;min-width:32px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.seltool button:hover{background:var(--panel-3)}
.seltool button.del:hover{background:var(--red)}
.pin-unused{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:700;color:#111;padding:5px 9px;border-radius:8px 8px 8px 2px;box-shadow:0 6px 14px rgba(0,0,0,.35);max-width:170px;line-height:1.2;pointer-events:none}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--txt);color:var(--bg);font-weight:700;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s;max-width:90%}
.placing{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--gold);color:#1b1400;font-weight:700;padding:9px 16px;border-radius:999px;display:flex;gap:10px;align-items:center}

/* decks */
.deck{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.deck .dn{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px}
.deck .dn i{width:12px;height:16px;border-radius:3px}
.deck .dn small{font-weight:500;color:var(--mute);font-size:12px}
.handrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;align-items:start}
.ctile{display:grid;gap:10px;align-content:start}
.ctile .flip{max-width:230px;margin:0 auto}
.ctile .ct{display:grid;gap:6px}
.ctile .ct b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.ctile .ct small{color:#d3dbea;font-size:13px;line-height:1.4}
.ctile .baa{margin-top:2px}
.ctile .rdr{justify-self:start}
.cgoal{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2)}
.cgoal span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.cpill{justify-self:start;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel-3);color:var(--mute)}
.cpill.now{background:var(--green);color:#06210f}
.cpill.done{background:transparent;border:1px solid var(--line-2)}
.hand .tag.now{background:var(--green);color:#06210f}
.nxwrap{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.nx{border-radius:14px;padding:14px 16px;background:var(--panel-2);border:1px solid var(--line-2)}
.nx .nh{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.nx .nh span{font-family:var(--f-body,inherit);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--txt);color:var(--bg)}
.nx.borrow .nh span{background:var(--green);color:#06210f}.nx.adapt .nh span{background:var(--gold);color:#1b1400}.nx.avoid .nh span{background:var(--bad);color:#fff}
.nx ol{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:13.5px;color:#d3dbea}
.nx ol b{color:var(--txt)}
.nx ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.nx .qa,.nx .kp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nx .kp{flex-direction:column;gap:4px}

function applyPlan(j,{W,D,furn,under}){

    for(const p of (j.partitions||[]).slice(0,30)){ const x1=r.x0+num(p.x1_m,0)*sx, z1=r.z0+num(p.y1_m,0)*sz, x2=r.x0+num(p.x2_m,0)*sx, z2=r.z0+num(p.y2_m,0)*sz; const len=Math.hypot(x2-x1,z2-z1); if(len<.3)continue;

    for(const f of (j.furniture||[]).slice(0,150)){ if(!DEF[f?.type]||f.type==='pwall')continue; const it={uid:S.uid++,type:f.type,x:+(r.x0+num(f.x_m,W/2)*sx).toFixed(2),z:+(r.z0+num(f.y_m,D/2)*sz).toFixed(2),rot:+(((Math.PI-num(f.rotation_deg,0)*Math.PI/180)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)).toFixed(4)};

function inspireBuild(n,seed,chairT,tries=8){
  const T=Math.max(SPACES[S.space].cls,...S.hand.r.map(k=>RULES[k]).filter(Boolean).map(r=>r.cls||0));
  const base=S.items.filter(i=>DEF[i.type]?.ceil), uid0=S.uid, recipe=INSPIRE[n]||INSPIRE[SPACES[S.space].insp[0]]; let best=null;
  const seatsNow=()=>S.items.reduce((a,i)=>a+(DEF[i.type].seats||0),0), fails=()=>{ runChecks(); return new Set(lastCheck.list.filter(c=>!c.ok).map(c=>c.id)) };
  const segD=(x,z,[ax,az],[bx,bz])=>{ const dx=bx-ax, dz=bz-az, L=dx*dx+dz*dz||1, t=Math.max(0,Math.min(1,((x-ax)*dx+(z-az)*dz)/L)); return Math.hypot(x-ax-t*dx,z-az-t*dz) };
  // build a few takes on the card and keep the one that seats the class with the exit route and walkways clear
  for(let k=0;k<tries;k++){ S.items=base.map(i=>({...i})); S.groups={}; S.uid=uid0; const P=inspPlanner(seed+k*7919,chairT,[1,2,1,2,0,1,2,0][k%8]);
    const more=recipe(P,T)||[], R0=P.reg(.3,P.F.W-.3,P.FV,P.F.D-.3);
    for(const kd of [...more,'smpod4']){ if(P.seats>=T)break; P.fill(kd,R0,{target:T,pad:k%2?.6:.55}) }
    if(P.seats<T&&k%3!==2) P.solo(R0,{target:T});
    P.centreMain(); let bad=fails();
    // exit blocked? lift out the table sets nearest the line between the two doors, up to 4 of them
    for(let rm=0; rm<2 && bad.has('exit') && DOORS.length>1; rm++){ const a=[DOORS[0].ix??DOORS[0].x,DOORS[0].iz??DOORS[0].z], b=[DOORS[1].ix??DOORS[1].x,DOORS[1].iz??DOORS[1].z]; let bu=null, bd=1e9;
      for(const it of S.items){ const u=it.grp||it.cl; if(!u)continue; const d=segD(it.x,it.z,a,b); if(d<bd){bd=d;bu=u} } if(!bu)break;
      S.items=S.items.filter(i=>(i.grp||i.cl)!==bu); delete S.groups[bu]; bad=fails() }
    const st=seatsNow(), score=Math.min(st,T)*10-(bad.has('exit')?400:0)-(bad.has('wheel')?60:0)-(bad.has('fit')?300:0)-(bad.has('budget')?40:0)+(S.items.some(i=>i.type==='teacher')?25:0)+(S.items.some(i=>DEF[i.type].display)?10:0)+k*.01;
    if(!best||score>best.score) best={score,items:JSON.stringify(S.items),groups:JSON.stringify(S.groups),uid:S.uid,seats:st} }
  S.items=JSON.parse(best.items); for(const i of S.items) delete i.cl; S.groups=JSON.parse(best.groups); S.uid=best.uid;
  selected=null; selFix=null; selWall=null; selZone=null; drag=null; syncAll(); syncMounted(); renderNotes(); runChecks(); renderCatalog(); renderCatalogCount(); renderSelTool(); lastPush=0; save();
  return {seats:best.seats,target:T} }

/* ===== project id: made once when a game starts; goes into saves and exports (and later a Google Sheet) ===== */
function newPid(){ const d=new Date(), p=n=>String(n).padStart(2,'0'), A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let r=''; const b=new Uint8Array(4); (crypto?.getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.random()*256)); for(const x of b)r+=A[x%A.length]; return `SDK-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${r}` }

/* ===== timer helpers: pause, time's up, +5 min extensions, hold while scoring ===== */
let timesUpPending=false, MODAL_CLOSE_HOOK=null;
function setPaused(v){ S.paused=!!v; $('#tPauseIc').setAttribute('d',S.paused?'M8 5l11 7-11 7z':'M9 5v14M15 5v14'); $('#timer').classList.toggle('paused',S.paused) }
const stepLeft=()=>step().dur+(S.extra||0)-S.stepElapsed;
function extendStep(){ S.extra=(S.extra||0)+300; S.upShown=false; timesUpPending=false; $('#timer').classList.remove('up'); setPaused(false); renderTimer(); save(); toast(`+5 minutes added to ${step().name}.`) }
function renderTimer(){ if(!S||S.mode==='free')return; const left=stepLeft(); $('#tval').textContent=fmt(Math.max(0,left)); $('#timer').classList.toggle('over',left<=0); $('#tExt').hidden=!S.upShown }
function timesUpDialog(){ const st=step(), nx=steps()[S.step+1], ext=Math.round((S.extra||0)/300);
  const m=modal(`<div class="hd"><div class="kick">Step ${S.step+1} · ${esc(st.name)}</div><h2>Time's up!</h2><p class="lead" style="margin:6px 0 0">${esc(st.name)} has used its ${Math.round(st.dur/60)} minutes${ext?` and ${ext*5} extra minute${ext*5>1?'s':''}`:''}. The timer is paused.</p></div>
   <div class="bd"><p style="margin:0">Need a little longer? Add 5 minutes. You can add more time as many times as you need.</p></div>

function holdTimer(){ if(!S||S.mode==='free'||MODAL_CLOSE_HOOK)return; const was=S.paused; setPaused(true); $('#timer').classList.add('held');

function askStep(i){ if(!S||S.mode==='free')return; if(i===S.step)return;
  if(DRAW){ toast('Finish editing the room first: press Done or Cancel on the drawing bar.'); return }
  if(i>=steps().length){ const m=modal(`<div class="hd"><div class="kick">Last step</div><h2>Finish the game?</h2><p class="lead" style="margin:6px 0 0">You'll see the summary of your design. Check your team is done first.</p></div><div class="ft"><button class="btn ghost" data-close>Not yet</button><button class="btn primary" id="asGo">Finish</button></div>`); m.querySelector('#asGo').onclick=()=>{closeModal();finish()}; return }

const steps=()=>MODES[S.mode].steps; const step=()=>steps()[S.step];
function renderSteps(){
  $('#steps').innerHTML=steps().map((s,i)=>`<button class="stp ${i<S.step?'done':''} ${i===S.step?'cur':''}" data-step="${i}" ${DRAW&&i!==S.step?'aria-disabled="true" title="Finish editing the room first"':''}><i>${i<S.step?'✓':i+1}</i><span>${esc(s.name)}</span></button>`).join(''); $('#steps').classList.toggle('locked',!!DRAW);
  $('#timer').hidden = S.mode==='free';
}
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)askStep(+b.dataset.step)});
function goStep(i){ if(i<0||i>=steps().length)return; S.step=i; S.stepElapsed=0; S.extra=0; S.upShown=false; timesUpPending=false; $('#timer').classList.remove('up'); setPaused(false); onEnterStep(); renderSteps(); renderGuide(); renderTimer(); save(); syncSheet() }
$('#tNext').onclick=()=>askStep(S.step+1); $('#tExt').onclick=()=>extendStep();
$('#tPause').onclick=()=>{ if(S.upShown){ timesUpDialog(); return } setPaused(!S.paused); save() };
function onEnterStep(){
  const id=step().id;
  if(id==='deal'&&S.hand.r.length===0) setTimeout(()=>draw('r'),300);
  if(id==='aware'&&S.hand.r.length===0) setTimeout(()=>draw('r'),300);
  if(id==='feas') feasDialog();
  if(id==='score') quickScoreDialog();
  if(id==='show') showcase(true); else showcase(false);
  if(id==='act') planDialog();
}
const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
let lastT=performance.now(), lastSave=0;
function tick(now){
  const dt=(now-lastT)/1000; lastT=now;
  if(S&&S.mode!=='free'&&!S.paused&&!S.finished&&!startOpen){
    S.stepElapsed+=dt; const st=step(); const left=stepLeft();
    if(left<=0&&!S.upShown){ S.stepElapsed=st.dur+(S.extra||0); S.upShown=true; setPaused(true); $('#timer').classList.add('up'); timesUpPending=true; save() }
    renderTimer();
    if(st.twist&&!S.twistDone&&S.stepElapsed>=st.twist){ S.twistDone=true; toast('Twist! A prompt card has been drawn. Follow it on the room view.'); draw('g') }
    if(st.nudge){ for(const t of st.nudge){ if(S.stepElapsed>=t&&!S.nudged.includes(t)){ S.nudged.push(t); if(S.hand.g.length&&S.promptAt<S.hand.g.length-1){ S.promptAt++; renderMission(); renderHands(); toast('Time for the next prompt: '+PROMPTS[S.hand.g[S.promptAt]-1]) } else if(!S.hand.g.length) toast('Time to draw your green Prompt cards.') } } }
    if(now-lastSave>5000){lastSave=now;save()}
  }
  if(timesUpPending&&S&&!$('#mdl')&&!startOpen){ timesUpPending=false; timesUpDialog() }
}
